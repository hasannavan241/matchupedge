<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Matchup Edge NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a stats desk. A header with data freshness, four tabs (Games, Players, Teams, How it works). Games: a board of
   every pick above one card per game; each card leads with the pick and a tug-of-war of the factors behind it, and the
   research opens in place. Players: a filterable list; a row opens the player's projection, milestones and games. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f5f8f6; --ink:#13201b; --ink-2:#3b4943; --muted:#56655e; --line:#d9e1dc;
  --accent:#0f6b4f; --accent-soft:#e0efe8; --accent-ink:#ffffff; --track:#e3e9e5;
  --seq-1:#cfe6dc; --seq-2:#8fc7b0; --seq-3:#0f6b4f; --dim:#b4c0ba;
  --away:#2a78d6; --home:#eb6834;
  --good:#0f7a4f; --good-soft:#dcf0e5; --warn:#8a5d00; --warn-soft:#f5ebd3; --serious:#a8480f; --serious-soft:#fbe6d8; --crit:#b3372a; --crit-soft:#f8e4e0;
  --shadow:0 10px 28px rgba(19,32,27,.14);
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1210; --surface:#131c18; --surface-2:#101814; --ink:#e3ebe7; --ink-2:#c3cec8; --muted:#93a39b; --line:#24332c;
  --accent:#4fc79a; --accent-soft:#16302a; --accent-ink:#0c1210; --track:#1f2b26;
  --seq-1:#1d3b31; --seq-2:#2f7a60; --seq-3:#4fc79a; --dim:#3d4c45;
  --away:#3987e5; --home:#d95926;
  --good:#4fd197; --good-soft:#12301f; --warn:#e2b44a; --warn-soft:#33290f; --serious:#f09a62; --serious-soft:#38210f; --crit:#ff806d; --crit-soft:#35191a;
  --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#131c18; --surface-2:#101814; --ink:#e3ebe7; --ink-2:#c3cec8; --muted:#93a39b; --line:#24332c;
  --accent:#4fc79a; --accent-soft:#16302a; --accent-ink:#0c1210; --track:#1f2b26;
  --seq-1:#1d3b31; --seq-2:#2f7a60; --seq-3:#4fc79a; --dim:#3d4c45;
  --away:#3987e5; --home:#d95926;
  --good:#4fd197; --good-soft:#12301f; --warn:#e2b44a; --warn-soft:#33290f; --serious:#f09a62; --serious-soft:#38210f; --crit:#ff806d; --crit-soft:#35191a;
  --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.wrap{padding-inline:24px}}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.k{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h3{font-size:13px;font-weight:700;margin:0;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
select,input[type=search],input[type=number]{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;min-width:0}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}

/* header and tabs */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,9.5vw,46px);line-height:.9;text-transform:uppercase;letter-spacing:.01em;margin:0}
.brand h1 span{color:var(--accent)}
.brand p{color:var(--ink-2);margin-top:6px;max-width:60ch}
/* the two sports are two pages of one site: index.html (NFL) and nba.html */
.sport{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);margin-bottom:8px}
.sport a{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:2px 12px;border-radius:999px}
.sport a:hover{color:var(--ink)}
.sport a[aria-current=page]{background:var(--ink);color:var(--bg)}
.fresh{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;border:0;background:none;padding:6px 14px 5px;cursor:pointer;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap}
@media (max-width:480px){.tabs{gap:0}.tabs button{font-size:15px;padding:6px 7px 5px;letter-spacing:.01em}.tabs .wk{display:none}}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabs .wk{margin-left:auto;align-self:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;padding-left:10px}
section.tab{display:flex;flex-direction:column;gap:14px}

/* the mix */
details.mix summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;list-style:none}
details.mix summary::-webkit-details-marker{display:none}
details.mix summary::before{content:"+";font-family:var(--f-mono);font-weight:600;color:var(--accent)}
details.mix[open] summary::before{content:"−"}
details.mix summary b{font-size:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 22px;margin-top:14px}
.w label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.w input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 2px}
.w small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag i{font-style:normal}
.t-held{background:var(--good-soft);color:var(--good)}
.t-weak{background:var(--warn-soft);color:var(--warn)}
.t-none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* the board */
.board td.pick b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.board tr{cursor:pointer}
.board td .sub{display:block;color:var(--muted);font-size:12px}
.board .sm{display:none}
@media (max-width:640px){.board .xs{display:none}.board .sm{display:inline}.board th,.board td{padding:7px 5px}}
.board tbody tr:hover td{background:var(--surface-2)}
.res td.pick b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.res td:first-child{white-space:nowrap}
.res .fin-s{display:none}
@media (max-width:640px){.res .xs{display:none}.res .fin-s{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}.res th,.res td{padding:7px 5px}}
.narrow{max-width:620px}
.split{display:flex;height:8px;gap:2px;min-width:90px}
.split i{display:block;height:100%}
.split .a{background:var(--away);border-radius:4px 0 0 4px}
.split .h{background:var(--home);border-radius:0 4px 4px 0}

/* game cards */
.games{display:flex;flex-direction:column;gap:14px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;margin-bottom:10px}
.gh .when{font-size:12px;color:var(--muted);font-weight:600}
.gtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px 26px;align-items:start}
@media (max-width:820px){.gtop{grid-template-columns:minmax(0,1fr)}}
.teamline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.teamline:last-of-type{border-bottom:0}
.teamline .nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.teamline .nm b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.teamline .nm span{color:var(--muted);font-size:12px;white-space:nowrap}
.teamline .sc{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sw.a{background:var(--away)} .sw.h{background:var(--home)}
.pickbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.pickbox b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.pickbox .conf{font-weight:600;color:var(--ink-2)}
.why{margin-top:10px;color:var(--ink-2);max-width:62ch}
.tug{display:flex;flex-direction:column;gap:5px}
.trow{display:grid;grid-template-columns:128px minmax(0,1fr) 92px;gap:10px;align-items:center}
@media (max-width:480px){.trow{grid-template-columns:100px minmax(0,1fr) 82px;gap:8px}}
.trow .tl{font-size:12.5px;font-weight:600;min-width:0}
.trow .tv{font-size:12px;text-align:right;white-space:nowrap}
.tb{position:relative;height:16px}
.tb::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.55}
.tb i{position:absolute;top:3px;height:10px}
.tb i.h{background:var(--home);border-radius:0 4px 4px 0}
.tb i.a{background:var(--away);border-radius:4px 0 0 4px}
.trow.off .tl,.trow.off .tv{color:var(--muted);font-weight:500}
.trow.sum{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.trow.sum .tl,.trow.sum .tv{font-weight:700}
.tax{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink-2)}
.tax span{display:inline-flex;align-items:center;gap:6px}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:13px}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 26px;margin-top:12px}
@media (max-width:820px){.sections{grid-template-columns:minmax(0,1fr)}}
.sec{min-width:0;display:flex;flex-direction:column;gap:8px}
.sec.wide{grid-column:1/-1}
.sec h4{margin:6px 0 0;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec p{color:var(--ink-2);max-width:68ch}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.p-out{background:var(--crit-soft);color:var(--crit)} .p-dbt{background:var(--serious-soft);color:var(--serious)} .p-q{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--good-soft);color:var(--good)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.plist li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px}
.plist li .pv{margin-left:auto;font-size:12px}
.plist li.off{color:var(--muted)}
.l5{display:inline-flex;gap:3px}
.l5 i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.l5 i.W{background:var(--good-soft);color:var(--good);border-color:transparent}
.news li{margin-bottom:6px;max-width:80ch}
.news{margin:0;padding-left:18px;color:var(--ink-2)}
.nt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* players */
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.controls input[type=search]{flex:1 1 180px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.likely{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
@media (max-width:820px){.likely{grid-template-columns:minmax(0,1fr)}}
.likely ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.likely li{display:grid;grid-template-columns:minmax(0,1fr) 64px 38px;gap:8px;align-items:center;font-size:13px}
.likely li button{all:unset;cursor:pointer;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.likely li button:hover{color:var(--accent)}
.likely li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meter{height:8px;background:var(--seq-1);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--seq-3);border-radius:4px 0 0 4px}
.plh,.prow{display:grid;grid-template-columns:minmax(0,1fr) 124px 92px 196px 76px 58px 82px;gap:0 10px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.plh{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.plh>span,.prow>span{text-align:right;min-width:0}
.plh>span:first-child,.prow>span:first-child{text-align:left}
@media (max-width:820px){.plh,.prow{grid-template-columns:minmax(0,1fr) 108px 52px}.plh .xs,.prow .xs{display:none}}
.prow{cursor:pointer}
.prow:hover,.prow.open{background:var(--surface-2)}
.prow .nm{font-weight:700}
.prow .sub{color:var(--muted);font-size:12px;display:block}
.pc{padding:14px 12px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2);border-bottom:1px solid var(--line);min-width:0}
.pc>*{min-width:0}
.pcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px 26px;align-items:start}
@media (max-width:820px){.pcgrid{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--f-display);font-size:42px;font-weight:700;line-height:1}
.big small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.range{position:relative;height:22px;margin:6px 0 2px}
.range .r90,.range .r50{position:absolute;top:7px;height:8px;border-radius:4px}
.range .r90{background:var(--seq-1)} .range .r50{background:var(--seq-2)}
.range .dot{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--seq-3);border:2px solid var(--surface-2)}
.range .mark{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.rax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr) 40px;gap:6px 10px;align-items:center;font-size:13px}
.ms .lab{font-weight:600;white-space:nowrap}
.you{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.you input{width:92px;font-family:var(--f-mono);font-weight:600}
.you .ans{font-weight:700}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .bar{fill:var(--dim)} .chart .bar.hit{fill:var(--seq-3)}
.chart .bar:hover,.chart .bar:focus{opacity:.8;outline:none}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink);stroke-width:1.5}
.chart .reft{fill:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px 14px}
.kv div{min-width:0}
.kv b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:600}
.kv span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:var(--shadow);line-height:1.35}

/* teams */
.rbar{position:relative;height:10px;width:110px;display:inline-block;vertical-align:middle}
.rbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.55}
.rbar i{position:absolute;top:0;height:10px;background:var(--seq-3)}
.rbar i.p{border-radius:0 4px 4px 0} .rbar i.n{border-radius:4px 0 0 4px;background:var(--dim)}
.sort{cursor:pointer;user-select:none;white-space:nowrap}
.sort:hover{color:var(--ink)}
.sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sort[data-dir]{color:var(--ink)}
.sort[data-dir]::after{content:" ▾";color:var(--accent)}
.sort[data-dir=asc]::after{content:" ▴"}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.filters .fg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.filters .k{margin:0}
.filters input.numin{width:76px}
.filters .clr{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer;padding:4px 2px}
.rk{font-size:11px;color:var(--muted);margin-left:4px}
tr.tsel td{background:var(--accent-soft)}
.teams td,.teams th{padding:7px 6px}

/* method */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1}
.kpi span{font-size:12px;color:var(--muted);line-height:1.4}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prose{display:flex;flex-direction:column;gap:10px}
.prose p{max-width:70ch;color:var(--ink-2)}
.dumb{position:relative;height:12px;width:150px;display:inline-block;vertical-align:middle}
.dumb::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:var(--track)}
.dumb i{position:absolute;top:1px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--surface)}
.dumb i.s{background:var(--dim)} .dumb i.w{background:var(--seq-3)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
footer{color:var(--muted);font-size:12px;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.tb i,.meter i{transition:width .25s ease,left .25s ease}}
</style>

const store={get(k,d){try{const v=localStorage.getItem('menba1.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('menba1.'+k,JSON.stringify(v))}catch(e){}}};
const pct1=v=>Number(v).toFixed(1);
/* a game in a player's log: "Apr 2", with the year when it is from before last season's end */
const shortDate=d=>{const t=new Date(d+'T12:00:00Z'),old=(Date.parse(D.built)-t)/864e5>300;return t.toLocaleDateString('en-US',Object.assign({month:'short',day:'numeric',timeZone:'UTC'},old?{year:'numeric'}:{}))};
const seasonName=y=>(y-1)+'-'+String(y).slice(2);

/* ---------- maths ---------- */
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)}
/* a stat is a count: negative binomial with variance a*mu + b*sqrt(mu) (nba_players.py) */
function sizeOf(s,mu){const ab=P.spread[s]||[1.2,0];const v=ab[0]*mu+ab[1]*Math.sqrt(mu);return mu*mu/Math.max(v-mu,1e-3)}
function cdf(s,mu,k){ /* P(X <= k) */
  if(k<0)return 0;mu=Math.max(mu,.02);const r=sizeOf(s,mu),lp=Math.log(r/(r+mu)),lq=Math.log(mu/(r+mu));let c=0;
  for(let i=0;i<=k;i++)c+=Math.exp(lgamma(i+r)-lgamma(r)-lgamma(i+1)+r*lp+i*lq);
  return Math.min(1,c)}
const atLeast=(s,mu,k)=>1-cdf(s,mu,Math.ceil(k)-1);
/* over a number: a whole number can land exactly on it, which is neither over nor under */
function overUnder(s,mu,L){
  if(L==null||!isFinite(L)||L<0)return null;
  const k=Math.floor(L);if(L===k){const c=cdf(s,mu,k),pm=c-cdf(s,mu,k-1);return{o:1-c,u:c-pm,eq:pm}}
  const c=cdf(s,mu,k);return{o:1-c,u:c,eq:0}}
function quant(s,mu,q){let k=0;while(k<200&&cdf(s,mu,k)<q)k++;return k}

/* ---------- the factors ---------- */
const TEST=M.test;
const FACTORS=[
  {k:'strength',label:'Team strength',max:200,def:100,tag:'held',note:'Point margins, adjusted for the opponents, recent games counting most. On its own (with home court) it picks '+pct1(TEST.results_only.win_pct)+'% of games right.'},
  {k:'lineup',label:'Who is playing',max:200,def:100,tag:'held',note:'Tonight’s players against the ones behind each team’s results: every player valued by his box score per minute, a lineup by its minutes. It catches stars sitting, and trades and signings since last season. With it the test rises to '+pct1(TEST.win_pct)+'%.'},
  {k:'home',label:'Home court',max:200,def:100,tag:'held',note:'Worth '+M.home.toFixed(1)+' points to the home team lately (it has shrunk over the years). Nothing at a neutral site.'},
  {k:'rest',label:'Back-to-backs',max:200,def:100,tag:'held',note:'A team on the second night of a back-to-back did worse: '+Math.abs(C.b2b_h).toFixed(1)+' points for a home team, '+Math.abs(C.b2b_a).toFixed(1)+' for a visitor.'},
  {k:'alt',label:'Altitude',max:200,def:100,tag:'weak',note:'Denver and Utah won by about '+C.alt.toFixed(1)+' points more at home than home court alone explains.'},
  {k:'news',label:'News',max:100,def:100,tag:'none',tagText:'Can’t be tested',note:'Researched items the stats can’t see: a coaching change, a player back from a long absence. Counted as written, at most '+M.news_cap+' points a team. Injuries are counted under Who is playing.'}
];
const TAGS={held:['✓','Held up in testing'],weak:['~','Small'],none:['–','No signal']};
const DEFW=()=>Object.fromEntries(FACTORS.map(f=>[f.k,f.def]));
const S={tab:'games',W:Object.assign(DEFW(),store.get('w',{})),open:new Set(store.get('open',[])),day:'ALL',stat:store.get('stat','pts'),game:'ALL',q:'',player:null,num:{},psort:['proj',-1]};
FACTORS.forEach(f=>{if(!(S.W[f.k]>=0&&S.W[f.k]<=f.max))S.W[f.k]=f.def});
const changed=()=>FACTORS.some(f=>S.W[f.k]!==f.def);

function calc(g){
  const x=g.x,w=k=>S.W[k]/100;
  const full={strength:x.strength,lineup:C.lineup*(x.roster+x.out),home:x.home,rest:C.b2b_h*x.b2b_h+C.b2b_a*x.b2b_a,alt:C.alt*x.alt,news:x.news||0};
  const c={};let m=0;FACTORS.forEach(f=>{c[f.k]=w(f.k)*full[f.k];m+=c[f.k]});
  const t=g.t,pH=Phi(m/M.sd),side=m>=0?'home':'away',p=m>=0?pH:1-pH;
  const hs=(t+m)/2,as=(t-m)/2,tie=Math.round(hs)===Math.round(as),sc=v=>tie?v.toFixed(1):String(Math.round(v));
  return{c,full,m,t,pH,side,p,team:g[side],other:g[side==='home'?'away':'home'],hs,as,hsT:sc(hs),asT:sc(as)};
}
const confWord=p=>p<.55?'a coin flip':p<.62?'a lean':p<.72?'a solid favorite':p<.85?'a strong favorite':'a heavy favorite';
const byT=(g,m)=>Math.abs(m)<.05?'dead even':`${m>0?g.home:g.away} by ${Math.abs(m).toFixed(1)}`;
const statusPill=s=>{if(!s)return'';const l=s.toLowerCase(),cls=l.startsWith('out')||l.startsWith('susp')?'p-out':l.startsWith('doubt')?'p-dbt':'p-q',ic=cls==='p-out'?'✕':cls==='p-dbt'?'!':'?';return `<span class="pill ${cls}"><i aria-hidden="true">${ic}</i>${esc(s)}</span>`};

/* ---------- games ---------- */
function whyText(g,r){
  const side=r.m>=0?1:-1,tm=side>0?g.home:g.away,op=side>0?g.away:g.home;
  const outN=i=>(g.lineups[i]||[]).filter(p=>p.f>=.5&&p.full>=15).sort((a,b)=>b.worth-a.worth).slice(0,2).map(p=>p.n);
  const ph={
    strength:v=>`${theN(v>0?g.home:g.away)} have the better results (${Math.abs(v).toFixed(1)} points)`,
    lineup:v=>{const j=v>0?0:1,o=outN(j),t=j?g.home:g.away;return o.length?`${theN(t)} are without ${o.join(' and ')} (${Math.abs(v).toFixed(1)})`:Math.abs(C.lineup*g.x.roster)>Math.abs(C.lineup*g.x.out)?`the rosters have changed in ${theN(v>0?g.home:g.away)}’ favor since the games behind the ratings (${Math.abs(v).toFixed(1)})`:`tonight’s lineups favor ${theN(v>0?g.home:g.away)} (${Math.abs(v).toFixed(1)})`},
    home:()=>`home court (${Math.abs(r.c.home).toFixed(1)})`,
    rest:v=>`${theN(v>0?g.away:g.home)} are on the second night of a back-to-back (${Math.abs(v).toFixed(1)})`,
    alt:v=>`the altitude in ${esc(nm(g.home))} territory (${Math.abs(v).toFixed(1)})`,
    news:v=>`the news favors ${theN(v>0?g.home:g.away)} (${Math.abs(v).toFixed(1)})`};
  const parts=FACTORS.map(f=>({k:f.k,v:r.c[f.k]})).filter(p=>Math.abs(p.v)>=.3).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const pro=parts.filter(p=>side*p.v>0).slice(0,3).map(p=>ph[p.k](p.v)),con=parts.filter(p=>side*p.v<0).slice(0,2).map(p=>ph[p.k](p.v));
  const list=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];
  let s=Math.abs(r.m)<.5?`Too close to call: the factors come out within half a point.`:`${nm(tm)} by ${Math.abs(r.m).toFixed(1)}.`;
  if(pro.length)s+=` For ${theN(tm)}: ${list(pro)}.`;
  if(con.length)s+=` For ${theN(op)}: ${list(con)}.`;
  return s;
}
function tug(g,r){
  const rows=FACTORS.map(f=>({f,v:r.c[f.k],full:r.full[f.k]})).filter(o=>Math.abs(o.full)>=.05||S.W[o.f.k]!==o.f.def);
  const mx=Math.max(3,Math.abs(r.m),...rows.map(o=>Math.abs(o.v)));
  const bar=v=>Math.abs(v)<.05?'':`<i class="${v>0?'h':'a'}" style="${v>0?'left':'right'}:50%;width:${(Math.abs(v)/mx*50).toFixed(1)}%"></i>`;
  const val=v=>Math.abs(v)<.05?'0':`${v>0?g.home:g.away} +${Math.abs(v).toFixed(1)}`;
  return `<div class="tug" role="img" aria-label="What goes into the pick, in points toward each team">
    <div class="tax" aria-hidden="true"><span><b class="sw a"></b>◀ ${esc(nm(g.away))}</span><span>${esc(nm(g.home))} ▶<b class="sw h"></b></span></div>
    ${rows.map(o=>{const off=S.W[o.f.k]===0;return `<div class="trow${off?' off':''}" data-tip="${esc(o.f.label+': '+(off?`not counted (it would be ${val(o.full)} at full weight)`:val(o.v)+(S.W[o.f.k]!==100?` at ${S.W[o.f.k]}% weight`:'')))}"><span class="tl">${esc(o.f.label)}</span><span class="tb">${bar(o.v)}</span><span class="tv num">${esc(val(o.v))}</span></div>`}).join('')}
    <div class="trow sum"><span class="tl">Projected margin</span><span class="tb">${bar(r.m)}</span><span class="tv num">${esc(byT(g,r.m))}</span></div></div>`;
}
function rotation(g,i){
  const L=(g.lineups[i]||[]).filter(p=>p.min>=1||(p.f>0&&p.full>=8)),t=i?g.home:g.away;
  if(!L.length)return `<p class="muted">No roster on record.</p>`;
  const rows=L.slice(0,12).map(p=>`<span class="${p.min<1?'off':''}"><b>${esc(p.n)}</b> <span class="muted">${esc(p.pos||'')}</span> ${p.st?statusPill(p.st):''}</span><span class="r">${p.min<1?'–':f0(p.min)}</span><span class="r">${sg(p.worth,1)}</span>`).join('');
  return `<div class="rot"><span class="h">${esc(nm(t))} tonight</span><span class="h r">Min</span><span class="h r">Worth</span>${rows}</div>`;
}
function lineupNote(g){
  const r=C.lineup*g.x.roster,o=C.lineup*g.x.out;
  const roster=Math.abs(r)>=.3?`The rosters, at full strength, are worth ${Math.abs(r).toFixed(1)} points to ${theN(r>0?g.home:g.away)} next to the lineups behind the two teams’ results`+(D.dates[0]&&Math.abs(r)>=2?' (trades, signings and players back from injury since then).':'.'):'At full strength the rosters are about what the teams’ results were built on.';
  const out=Math.abs(o)>=.3?` Tonight’s injury list moves ${Math.abs(o).toFixed(1)} points to ${theN(o>0?g.home:g.away)}.`:'';

}
function newsBlock(g){
  const d=D.news['nba_'+g.id];if(!d)return `<div class="sec wide"><h3>News</h3><p class="muted">No news research for this game yet. It is researched closer to tip-off.</p></div>`;

    return `<li><span class="nt">${esc(it.type||'')}</span> ${esc(String(it.text||'').slice(0,260))}${counted?` <b class="num">${esc(it.team)} ${sg(it.impact)}</b>`:''}${u?` <a href="${esc(u)}" target="_blank" rel="noopener">source</a>`:''}</li>`}).join('');

function teamFacts(t){const x=T[t];if(!x)return'';return `${esc(x.rec)} this season · ${ord(x.rank)} in our ratings (${sg(x.r)}) · scores ${f1(x.off)}, allows ${f1(x.def)} · pace ${f1(x.pace)}`}
function gameCard(g){
  const r=calc(g),A=T[g.away]||{},H=T[g.home]||{},k='g-'+g.id;
  const rest=i=>{const d=g.rest[i];return d==null||d>20?'first game in a while':d===1?'second night of a back-to-back':`${d} days since the last game`};

  return `<article class="card" id="${k}" data-g="${esc(g.id)}">
    <div class="gh"><h2>${esc(nm(g.away))} at ${esc(nm(g.home))}</h2><span class="when">${esc(g.day)} ${esc(g.ct)} CT${g.venue?' · '+esc(g.venue):''}${g.neutral?' · neutral site':''}</span></div>
    <div class="gtop"><div>
      <div class="teamline"><span class="nm"><i class="sw a"></i><b>${esc(g.away)}</b><span>${esc(A.rec||'')} · ${A.rank?ord(A.rank)+' in our ratings':''}</span></span><span class="sc num">${r.asT}</span></div>
      <div class="teamline"><span class="nm"><i class="sw h"></i><b>${esc(g.home)}</b><span>${esc(H.rec||'')} · ${H.rank?ord(H.rank)+' in our ratings':''}</span></span><span class="sc num">${r.hsT}</span></div>
      <div class="pickbox"><span class="k">Our pick</span><b>${esc(nm(r.team))} ${pc(r.p)}</b> <span class="conf">${confWord(r.p)}</span>
        <div class="split" style="margin-top:8px" role="img" aria-label="${esc(g.away)} ${pc(1-r.pH)}, ${esc(g.home)} ${pc(r.pH)}"><i class="a" style="width:${((1-r.pH)*100).toFixed(1)}%"></i><i class="h" style="width:${(r.pH*100).toFixed(1)}%"></i></div>

        <div class="sec"><h3>${esc(nm(g.away))}</h3><p>${teamFacts(g.away)}</p><p class="fine">Rest: ${rest(0)}. Last season: ${esc(A.last||'–')}.</p></div>
        <div class="sec"><h3>${esc(nm(g.home))}</h3><p>${teamFacts(g.home)}</p><p class="fine">Rest: ${rest(1)}. Last season: ${esc(H.last||'–')}.</p></div>
        <div class="sec wide"><h3>Head to head</h3><p>${h2h}</p><p class="fine">The total: ${f1(r.t)} points, from both teams’ scoring and defense over the same games as their ratings.</p></div>
        ${newsBlock(g)}

}

function board(){

const STATS=['pts','reb','ast','tpm','pra','stl','blk','tov'];
const LOGC={pts:3,reb:4,ast:5,tpm:6,stl:7,blk:8,tov:9};
const logVal=(r,s)=>s==='pra'?r[3]+r[4]+r[5]:r[LOGC[s]];
const pid=p=>p.i+'|'+p.g;
const BYID={};P.players.forEach(p=>{BYID[pid(p)]=p});
const gameOf=id=>D.games.find(g=>g.id===id);
function likely(){
  const list=(label,s,k)=>{const a=P.players.map(p=>({p,v:(1-(p.f||0))*atLeast(s,p.mu[s],k)})).sort((x,y)=>y.v-x.v).slice(0,6);
    return `<div><h3>${label}</h3><ol>${a.map(o=>`<li><button type="button" data-open="${esc(pid(o.p))}">${esc(o.p.n)} <span class="muted">${esc(o.p.t)}</span></button><div class="meter" aria-hidden="true"><i style="width:${(o.v*100).toFixed(0)}%"></i></div><span class="num">${pc(o.v)}</span></li>`).join('')}</ol></div>`};
  return `<div class="card"><div class="gh"><h2>Most likely</h2><span class="when">from every projected player, ${esc(D.dates.map(d=>dayName(d).split(',')[0]).join(' and '))}, counting the chance a listed player sits</span></div><div class="likely">
    ${list('25+ points','pts',25)}${list('10+ rebounds','reb',10)}${list('8+ assists','ast',8)}</div></div>`;
}
const defNum=(p,s)=>Math.max(.5,Math.floor(quant(s,p.mu[s],.5))+.5);
const numOf=(p,s)=>{const k=pid(p)+'|'+s;return S.num[k]!=null?S.num[k]:defNum(p,s)};
function rangeBar(p,s){
  const mu=p.mu[s],q=x=>quant(s,mu,x),a=q(.1),b=q(.25),c=q(.75),d=q(.9),hi=Math.max(d*1.15,4),x=v=>(Math.max(0,Math.min(hi,v))/hi*100).toFixed(1)+'%';
  return `<div class="range" role="img" aria-label="Usual range ${b} to ${c}; four games in five between ${a} and ${d}"><i class="r90" style="left:${x(a)};width:calc(${x(d)} - ${x(a)})"></i><i class="r50" style="left:${x(b)};width:calc(${x(c)} - ${x(b)})"></i><i class="dot" style="left:${x(mu)}" data-tip="Projection ${f1(mu)}"></i></div>
    <div class="rax num"><span>0</span><span>${f0(hi/2)}</span><span>${f0(hi)}</span></div>`;
}
function playerCard(p){
  const s=STATS.includes(S.stat)?S.stat:'pts',mu=p.mu[s],L=numOf(p,s),ou=overUnder(s,mu,L),marks=(P.marks[s]||[]).map(k=>({k,v:atLeast(s,mu,k)})).filter(o=>o.v>=.03&&o.v<=.98);
  const g=gameOf(p.g),log=p.log||[],last=log.slice(0,10),hit=last.filter(r=>logVal(r,s)>L).length;
  const avg=k=>last.length?last.reduce((a,r)=>a+logVal(r,k),0)/last.length:null;
  return `<div class="pc"><div class="pcgrid"><div>
      <span class="k">${esc(SL[s])} projected${p.f>0?' if he plays':''}</span><div class="big">${f1(mu)}<small>in ${f0(p.min)} minutes</small></div>
      ${rangeBar(p,s)}<p class="fine">Usual range ${quant(s,mu,.25)} to ${quant(s,mu,.75)}; four games in five between ${quant(s,mu,.1)} and ${quant(s,mu,.9)}.</p>
      <div class="you" style="margin-top:10px"><label for="yn">Your number</label><input id="yn" type="number" step="0.5" min="0" value="${L}" data-num="${esc(pid(p))}|${s}"><span class="ans">Over ${pc(ou&&ou.o)} · under ${pc(ou&&ou.u)}</span>${ou&&ou.eq>=.005?`<span class="fine">exactly ${L}: ${pc(ou.eq)}</span>`:''}</div>
      <p class="fine" style="margin-top:6px">Over ${L} in ${hit} of his last ${last.length} games.</p>${p.st?`<p class="fine" style="margin-top:4px">${statusPill(p.st)} We count a ${pc(p.f)} chance he sits. The numbers here are for a game he plays.</p>`:''}</div>
    <div><span class="k">Chance of at least</span><div class="ms" style="margin-top:6px">${marks.map(o=>`<span class="lab">${o.k}+ ${esc(SSH[s])}</span><div class="meter" aria-hidden="true"><i style="width:${(o.v*100).toFixed(0)}%"></i></div><span class="num">${pc(o.v)}</span>`).join('')||'<span class="muted">–</span>'}</div>
      <div class="kv" style="margin-top:12px">${['pts','reb','ast','tpm','pra'].map(k=>`<div><b>${f1(p.mu[k])}</b><span>${esc(SL[k])} projected${avg(k)!=null?` · last ${last.length}: ${f1(avg(k))}`:''}</span></div>`).join('')}</div></div></div>
    ${last.length?`<div class="scroll"><table class="log"><thead><tr><th class="l">Last games</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>3PM</th><th class="xs">Stl</th><th class="xs">Blk</th><th class="xs">TO</th></tr></thead><tbody>${last.map(r=>`<tr><td class="l"><span class="nw">${esc(shortDate(r[0]))}</span> <span class="muted">${esc(r[1])}</span></td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td><td class="num xs">${r[7]}</td><td class="num xs">${r[8]}</td><td class="num xs">${r[9]}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No NBA games on record yet: the projection is the league’s average rates in his expected minutes.</p>'}
  </div>`;
}
function playerRows(){
  const q=S.q.trim().toLowerCase(),s=S.stat;
  let L=P.players.filter(p=>(S.game==='ALL'||p.g===S.game)&&(!q||p.n.toLowerCase().includes(q)||p.t.toLowerCase()===q));
  const [k,dir]=S.psort,key={proj:p=>p.mu[s],min:p=>p.min,name:null}[k];
  if(!key)return L.sort((a,b)=>a.n.localeCompare(b.n)*dir);
  return L.sort((a,b)=>(key(a)-key(b))*dir||a.n.localeCompare(b.n));
}

    <div class="plh" style="margin-top:10px">${th('name','Player','')}${th('proj',esc(SL[s].replace('Points + rebounds + assists','P+R+A')),'')}${th('min','Minutes','')}<span class="xs">Usual range</span><span class="xs">Over the middle</span><span class="xs"></span><span class="xs">Last 10 avg</span></div>
    ${L.map(p=>{const mu=p.mu[s],a=quant(s,mu,.25),b=quant(s,mu,.75),last=(p.log||[]).slice(0,10),avg=last.length?last.reduce((x,r)=>x+logVal(r,s),0)/last.length:null,open=S.player===pid(p);
      return `<div class="prow${open?' open':''}" data-p="${esc(pid(p))}" tabindex="0" role="button" aria-expanded="${open}"><span><span class="nm">${esc(p.n)}</span>${p.st?' '+statusPill(p.st):''}<span class="sub">${esc(p.t)} ${p.home?'vs':'at'} ${esc(p.o)} · ${esc(p.pos||'')}</span></span><span class="num"><b>${f1(mu)}</b></span><span class="num">${f0(p.min)}</span><span class="xs num">${a}–${b}</span><span class="xs num">${pc(1-cdf(s,mu,Math.floor(quant(s,mu,.5))))}</span><span class="xs"></span><span class="xs num">${f1(avg)}</span></div>${open?playerCard(p):''}`}).join('')||'<p class="muted" style="padding:10px">No player matches.</p>'}
    <p class="fine" style="margin-top:8px">Players expected to play 12 minutes or more. A projection is his minutes tonight times his rate per minute, adjusted for both teams’ pace${s==='pts'?' and the other team’s defense':''}. Over the middle: the chance of beating the middle of his range. A player on the injury list is projected for a game he plays; his card says how likely he is to sit.</p></div>`;

    <div class="scroll"><table class="teams"><thead><tr><th class="l">Team</th><th>Rating</th><th class="xs"></th><th>Scores</th><th>Allows</th><th class="xs">Pace</th><th>This season</th><th class="xs">Last season</th><th class="xs">Roster since</th><th class="l xs">Most valuable</th></tr></thead><tbody>
    ${L.map(([t,x])=>`<tr><td class="l"><b>${x.rank}. ${esc(x.name)}</b> <span class="muted">${esc(t)}</span></td><td class="num">${sg(x.r)}</td><td class="xs">${bar(x.r)}</td><td class="num">${f1(x.off)}</td><td class="num">${f1(x.def)}</td><td class="num xs">${f1(x.pace)}</td><td class="num">${esc(x.rec)}</td><td class="num xs">${esc(x.last)}</td><td class="num xs">${sg(x.roster)}</td><td class="l xs">${x.top&&x.top[0]?esc(x.top[0].n)+` <span class="num muted">${f1(x.top[0].worth)}</span>`:'–'}</td></tr>`).join('')}</tbody></table></div>

/* ---------- how it works ---------- */
function calChart(){
  const B=TEST.calibration;const W=innerWidth<620?340:560,H=200,pl=34,pr=10,pt=10,pb=30;
  const x=v=>pl+(W-pl-pr)*(v-50)/50,y=v=>pt+(H-pt-pb)*(1-(v-50)/50);
  const dots=B.map(b=>`<circle cx="${x(b.said).toFixed(1)}" cy="${y(b.won).toFixed(1)}" r="${Math.max(3.5,Math.min(9,Math.sqrt(b.games)/5)).toFixed(1)}" fill="var(--seq-3)" stroke="var(--surface)" stroke-width="2" tabindex="0" data-tip="Said ${b.said}%, won ${b.won}% (${b.games.toLocaleString()} games)"></circle>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chance given against how often the pick won">
    ${[50,60,70,80,90,100].map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"></line><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}%</text><text x="${x(v)}" y="${H-10}" text-anchor="middle">${v}%</text>`).join('')}
    <line class="ref" x1="${x(50)}" y1="${y(50)}" x2="${x(100)}" y2="${y(100)}" stroke-dasharray="4 4"></line>${dots}</svg></div><p class="fine">Across: the chance the pick was given. Up: how often it won. On the dashed line is exactly right.</p>`;
}
function recordCard(){
  const R=REC,all=wl(R),miss=missOf(R),since=D.record&&D.record.since?new Date(D.record.since).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/Chicago'}):null;
  if(D.record&&D.record.broken)return `<div class="card"><h2>Our record</h2><p class="muted">The record file can’t be read right now; it is left as it is until it is repaired.</p></div>`;
  return `<div class="card"><div class="gh"><h2>Our record</h2><span class="when">${since?'Picks on record since '+esc(since):'Starting with the first game'}</span></div>
    <div class="prose"><p>The numbers above are a test on past seasons. This is the live record: each pick as this page showed it at its last refresh before tip-off, graded when the game ends. A saved pick can’t be changed once its game starts.</p></div>
    ${all.f?`<div class="kv" style="margin-top:10px"><div><b>${wlText(all)}</b><span>winners picked (${pc(all.w/all.f)})</span></div><div><b>${f1(miss)}</b><span>average miss on the final margin, in points</span></div><div><b>${all.f}</b><span>games graded. A season is 1,230, so a few weeks is a small sample</span></div></div>
    <details style="margin-top:10px"><summary class="fine" style="cursor:pointer">Every pick, newest first</summary>${resTable(R.slice().reverse())}</details>`:`<p class="muted" style="margin-top:8px">No pick has been graded yet. The picks are saved before each tip-off; the record starts with the first final.</p>`}</div>`;
}
function playersTest(){
  const t=P.test;if(!t)return'';
  const BANDS=[[10,25,'xs'],[25,50,''],[50,75,''],[75,90,'xs']];
  const cell=(s,lo,cls)=>{const b=(t[s].bands||[]).find(x=>x.from===lo);return b?`<td class="num${cls?' '+cls:''}">${Number(b.said).toFixed(1)}% → ${Number(b.happened).toFixed(1)}%</td>`:`<td class="${cls}">–</td>`};
  const rows=['pts','reb','ast','tpm','pra'].filter(s=>t[s]).map(s=>`<tr><td class="l">${esc(SL[s])}</td><td class="num xs">${f1(t[s].mean)}</td><td class="num">${f1(t[s].mae)}</td>${BANDS.map(([lo,,cls])=>cell(s,lo,cls)).join('')}</tr>`).join('');
  return `<div class="card"><div class="gh"><h2>The player test</h2><span class="when">${(P.test_seasons||[]).map(seasonName).join(' and ')} seasons, ${t.pts?t.pts.n.toLocaleString():''} player-games</span></div>
    <div class="scroll"><table class="ptest"><thead><tr><th class="l">Stat</th><th class="xs">Average</th><th><span class="xs">Average </span>miss</th>${BANDS.map(([lo,hi,cls],i)=>`<th${cls?` class="${cls}"`:''}>${i===0||i===1?'<span class="xs">Said </span>':''}${lo}–${hi}%</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="fine" style="margin-top:8px">Every player-game of the last two seasons, projected with only what was known before it: his rates and minutes from earlier games, the minutes handed out over the players who dressed. The chance of each round mark, grouped: when we said 50 to 75%, how often it happened. The spreads were fitted on the two seasons before.</p></div>`;
}
function renderMethod(){
  const t=TEST,byS=t.by_season;
  $('#method').innerHTML=`<div class="kpis"><div class="kpi"><b>${pct1(t.win_pct)}%</b><span>winners picked, ${seasonName(t.first)} to ${seasonName(t.last)} (${t.games.toLocaleString()} regular-season games)</span></div>
    <div class="kpi"><b>${Number(t.mae).toFixed(2)}</b><span>points, the average miss on the final margin</span></div>
    <div class="kpi"><b>${pct1(t.results_only.win_pct)}%</b><span>with team results and home court alone</span></div>
    <div class="kpi"><b>${pct1(t.home_pct)}%</b><span>always picking the home team</span></div></div>
    <div class="card prose"><h2>How a pick is made</h2>
      <p>A game’s projected margin is a sum of factors, each in points toward the home team. <b>Team strength</b>: every team’s point margins, adjusted for who they played, recent games counting most (a game’s weight halves every ${Math.round(M.params.tau*Math.LN2)} days, so last season still counts in the fall). <b>Home court</b>: fitted the same way. <b>Who is playing</b>: every player has a value, his box score per minute added up the way Hollinger’s Game Score does it, over about the last season and a half and shrunk toward a fringe player’s; a lineup is its players’ values weighted by their minutes. Tonight’s lineup against the lineups behind a team’s results moves the margin by ${C.lineup.toFixed(0)} points for each point of game score per minute: a star sitting, a trade, a signing, a player back from injury. <b>Back-to-backs</b> and <b>altitude</b> as fitted. <b>News</b>, researched for each game, counted as written.</p>
      <p>The margin becomes a win chance on a ${M.sd.toFixed(1)}-point spread of outcomes, the width that made the chances come true in testing. The projected total comes from both teams’ scoring and defense.</p>
      <p>Each season of the test was picked with ratings and player values from earlier games only, and with the weights fitted on the seasons before it. What the test cannot see: it knows which players dressed for old games, while a live pick goes on the injury report, where a questionable player is counted by how often his status sits. The first weeks of a season are the hardest: in testing, the first 50 games of a season were picked about 62% right, against 68% after the first month.</p>
      <p>Nothing here comes from a sportsbook. There are no lines, prices or odds anywhere in the numbers.</p></div>
    <div class="two"><div class="card"><div class="gh"><h2>By season</h2></div><div class="scroll"><table><thead><tr><th class="l">Season</th><th>Games</th><th>Winners</th><th>Average miss</th></tr></thead><tbody>${byS.map(b=>`<tr><td class="l">${seasonName(b.season)}</td><td class="num">${b.games.toLocaleString()}</td><td class="num">${pct1(b.win_pct)}%</td><td class="num">${Number(b.mae).toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="gh"><h2>Were the chances right?</h2></div>${calChart()}</div></div>
    ${recordCard()}${playersTest()}
    <div class="card prose"><h2>Sources</h2><p>Box scores, schedules and rosters: hoopR (the SportsDataverse), built from ESPN, updated every morning. Injuries: ESPN’s NBA injury list, read at each refresh. News: researched for each game from team sites and news outlets, never from a sportsbook.</p></div>`;
}
