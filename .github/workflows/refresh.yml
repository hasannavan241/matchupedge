# Refreshes the site through the day, every day, and publishes it to GitHub Pages (the gh-pages branch).
# pipeline/schedule.py decides what each scheduled run does, in Central time, from what the site last published: a lines
# refresh about every hour from 6 AM to 10 PM (about every half hour in the three hours before an NFL kickoff); a full
# refresh (every book's player-prop prices too) around 11 AM and 6 PM and 80 minutes before NFL kickoffs; nothing
# overnight, and nothing when the site was refreshed recently (such a run ends in seconds).
#
# GitHub's scheduler can't be relied on: since late August 2026 it has dropped scheduled runs, or started them hours
# late, for many repositories, and on 2026-10-04 it started none of this one's (every 10 minutes, then every half hour,
# plus tick.yml's hourly ones), while runs asked for directly started at once. The schedule below and tick.yml stay
# for whenever GitHub does start them; the working clock is clock.yml, a chain of runs that wait on a timer and ask
# for the next refresh, and the last step here starts that chain whenever it finds it stopped.
# The Odds API key comes only from the repository secret ODDS_API_KEY; it is never written to the site or committed.
name: Refresh site

on:
  schedule:
    # GitHub schedules run on UTC. These hours cover 6 AM to 10 PM Central in both daylight and standard time;
    # schedule.py skips the hour that falls outside it.
    - cron: "12,42 0-4,11-23 * * *"
  workflow_dispatch:            # run it any time from the Actions tab
    inputs:
      mode:
        description: "full: everything, with every book's player-prop prices. lines: game lines and news only. auto: whichever the schedule calls for now. tick: what a scheduled run would do now (nothing, if the site was refreshed recently)."
        type: choice
        options: [full, lines, auto, tick]
        default: full
  push:
    branches: [main]
    # the news file too: researched news is on the site a few minutes after it is saved
    paths: ["pipeline/**", ".github/workflows/**", "data/news.json"]

permissions:
  contents: write
  actions: write      # to start the clock (clock.yml) when it has stopped

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: What the last refresh published
        run: |
          # beside the page, the published site keeps the Props tab of the last full refresh (props.json) and a note of
          # what the last refresh was (state.json)
          rm -f pipeline/prev_state.json pipeline/props_prev.json
          if git fetch --quiet --depth=1 origin gh-pages; then
            git show FETCH_HEAD:state.json > pipeline/prev_state.json 2>/dev/null || rm -f pipeline/prev_state.json
            git show FETCH_HEAD:props.json > pipeline/props_prev.json 2>/dev/null || rm -f pipeline/props_prev.json
          fi

      - name: Full refresh, lines refresh, or nothing yet
        id: plan
        env:
          ME_EVENT: ${{ github.event_name }}
          ME_WANT: ${{ inputs.mode }}
        run: python3 pipeline/schedule.py pipeline/prev_state.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.mode != 'skip'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.mode != 'skip'
        with:
          node-version: "20"

      - name: Install
        if: steps.plan.outputs.mode != 'skip'
        run: |
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Player history for the props (finished seasons don't change)
        if: steps.plan.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: pipeline/props
          key: props-${{ steps.plan.outputs.day }}   # saved once a day; the hourly runs restore it
          restore-keys: props-

      - name: Download schedules, results and stats; plan the week
        if: steps.plan.outputs.mode != 'skip'
        working-directory: pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ME_MODE: ${{ steps.plan.outputs.mode || 'lines' }}   # if schedule.py ever fails: the cheap refresh, not none
        run: python refresh.py fetch

      - name: Live lines, forecasts, injuries and every book's prices
        if: steps.plan.outputs.mode != 'skip'
        working-directory: pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python refresh.py live

      - name: Build the page, update the model record, and check that the page loads
        if: steps.plan.outputs.mode != 'skip'
        working-directory: pipeline
        env:
          ME_NEWS: ../data/news.json
          ME_PICKS: ../data/picks.json
          ME_RESULTS: ../data/results.json
        run: |
          rm -f browser.js
          python refresh.py build
          python refresh.py record
          python refresh.py build
          python refresh.py web
          python refresh.py check

      - name: Best bets
        if: steps.plan.outputs.mode != 'skip'
        working-directory: pipeline
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python refresh.py summary | tee summary.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save the model record and results
        if: steps.plan.outputs.mode != 'skip'
        run: |
          git config user.name "matchup-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/results.json data/props_picks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update model record and results"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi

      - name: Publish to GitHub Pages
        if: steps.plan.outputs.mode != 'skip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          mkdir -p out
          cp pipeline/web/index.html out/index.html
          cp pipeline/site.html out/artifact.html    # the same page without a document head, for the claude.ai copy
          if [ -f pipeline/summary.txt ]; then cp pipeline/summary.txt out/summary.txt; fi   # best bets as text, for the claude.ai copy task
          if [ -f data/results.json ]; then cp data/results.json out/results.json; fi   # finals, for grading older bets
          if [ -f pipeline/props.json ]; then cp pipeline/props.json out/props.json; fi   # the Props tab, which the next lines refresh carries over
          if [ -f pipeline/state.json ]; then cp pipeline/state.json out/state.json; fi   # what this refresh was: schedule.py and the open page read it
          touch out/.nojekyll
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > out/CNAME; fi
          cd out
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="matchup-edge-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Keep the clock running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # clock.yml is a chain of waiting runs that ask for the next refresh; start it if no link is waiting or queued
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow clock.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length' || echo unknown)
          echo "clock links not finished: $waiting"
          if [ "$waiting" = "0" ]; then gh workflow run clock.yml --repo "$GITHUB_REPOSITORY" --ref main -f asked="$(date -u +%s)" || true; fi
