# Refreshes the site twice each weekday and publishes it to GitHub Pages (the gh-pages branch).
# The Odds API key comes only from the repository secret ODDS_API_KEY; it is never written to the site or committed.
name: Refresh site

on:
  schedule:
    # GitHub schedules run on UTC: 11:47 AM and 5:47 PM Central in daylight time, an hour earlier in winter.
    # The morning run comes well after the news research (9:48 AM Central) has saved data/news.json.
    - cron: "47 16 * * 1-5"
    - cron: "47 22 * * 1-5"
  workflow_dispatch:            # run it any time from the Actions tab
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Download schedules, results and stats; plan the week
        working-directory: pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python refresh.py fetch

      - name: Live lines, forecasts, injuries and every book's prices
        working-directory: pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python refresh.py live

      - name: Build the page and update the model record
        working-directory: pipeline
        env:
          ME_NEWS: ../data/news.json
          ME_PICKS: ../data/picks.json
          ME_RESULTS: ../data/results.json
        run: |
          rm -f browser.js
          python refresh.py build
          python refresh.py record
          python refresh.py build
          python refresh.py web

      - name: Best bets
        working-directory: pipeline
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python refresh.py summary | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save the model record and results
        run: |
          git config user.name "matchup-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update model record and results"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi

      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          mkdir -p out
          cp pipeline/web/index.html out/index.html
          cp pipeline/site.html out/artifact.html    # the same page without a document head, for the claude.ai copy
          if [ -f data/results.json ]; then cp data/results.json out/results.json; fi   # finals, for grading older bets
          touch out/.nojekyll
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > out/CNAME; fi
          cd out
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="matchup-edge-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
