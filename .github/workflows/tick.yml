# A second schedule for the site's refresh, once an hour between refresh.yml's own half-hourly one, for whenever
# GitHub's scheduler does start runs (see refresh.yml and clock.yml: it often doesn't). It only asks the Refresh site
# workflow for a run of the kind a scheduled run would be; pipeline/schedule.py then decides whether anything is due,
# and that run restarts clock.yml's chain if it has stopped.
name: Refresh site (second clock)

on:
  schedule:
    # the same hours as refresh.yml: 6 AM to 10 PM Central in daylight and standard time
    - cron: "27 0-4,11-23 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the Refresh site workflow for a run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=tick
