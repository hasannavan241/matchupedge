# A second clock for the site's refresh. GitHub starts scheduled runs late and seems to drop one that hasn't started when
# the same workflow's next one comes due (see refresh.yml), so each schedule is kept sparse and there are two of them:
# refresh.yml's own, every half hour, and this one, once an hour between them. This one only asks the Refresh site
# workflow for a run of the kind a scheduled run would be; pipeline/schedule.py then decides whether anything is due,
# so when both clocks work the second run ends in seconds.
name: Refresh site (second clock)

on:
  schedule:
    # the same hours as refresh.yml: 6 AM to 10 PM Central in daylight and standard time
    - cron: "27 0-4,11-23 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the Refresh site workflow for a run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=tick
