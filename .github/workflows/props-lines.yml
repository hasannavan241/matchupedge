# Twice a week: every finished game's player prop lines from ESPN (ESPN BET's with prices through 2025, DraftKings' since),
# and the props model's out-of-sample projections tested against them. Writes data/props_lines_backtest.json, which the
# Props tab shows (and the next refresh builds in). Run it any time from the Actions tab.
name: Props line backtest

on:
  schedule:
    # Tuesdays and Fridays 10:17 AM Central in daylight time (9:17 in winter): after Monday night's game and nflverse's
    # weekly stats, and again before the weekend (twice a week also keeps the saved lines from being cleared)
    - cron: "17 15 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Player history (finished seasons don't change)
        uses: actions/cache@v4
        with:
          path: pipeline/props
          key: props-${{ github.run_id }}
          restore-keys: props-

      - name: Past prop lines (finished games don't change)
        uses: actions/cache@v4
        with:
          path: pipeline/props_lines
          key: lines-${{ github.run_id }}
          restore-keys: lines-

      - name: Lines and backtest
        working-directory: pipeline
        run: |
          set -o pipefail
          python refresh.py props-lines | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the backtest
        run: |
          git config user.name "matchup-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/props_lines_backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update props line backtest"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
