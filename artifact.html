<title>Matchup Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a stats desk. A header with data freshness, four tabs (Games, Players, Teams, How it works). Games: a board of
   every pick above one card per game; each card leads with the pick and a tug-of-war of the factors behind it, and the
   research opens in place. Players: a filterable list; a row opens the player's projection, milestones and games. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f5f8f6; --ink:#13201b; --ink-2:#3b4943; --muted:#56655e; --line:#d9e1dc;
  --accent:#0f6b4f; --accent-soft:#e0efe8; --accent-ink:#ffffff; --track:#e3e9e5;
  --seq-1:#cfe6dc; --seq-2:#8fc7b0; --seq-3:#0f6b4f; --dim:#b4c0ba;
  --away:#2a78d6; --home:#eb6834;
  --good:#0f7a4f; --good-soft:#dcf0e5; --warn:#8a5d00; --warn-soft:#f5ebd3; --serious:#a8480f; --serious-soft:#fbe6d8; --crit:#b3372a; --crit-soft:#f8e4e0;
  --shadow:0 10px 28px rgba(19,32,27,.14);
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1210; --surface:#131c18; --surface-2:#101814; --ink:#e3ebe7; --ink-2:#c3cec8; --muted:#93a39b; --line:#24332c;
  --accent:#4fc79a; --accent-soft:#16302a; --accent-ink:#0c1210; --track:#1f2b26;
  --seq-1:#1d3b31; --seq-2:#2f7a60; --seq-3:#4fc79a; --dim:#3d4c45;
  --away:#3987e5; --home:#d95926;
  --good:#4fd197; --good-soft:#12301f; --warn:#e2b44a; --warn-soft:#33290f; --serious:#f09a62; --serious-soft:#38210f; --crit:#ff806d; --crit-soft:#35191a;
  --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#131c18; --surface-2:#101814; --ink:#e3ebe7; --ink-2:#c3cec8; --muted:#93a39b; --line:#24332c;
  --accent:#4fc79a; --accent-soft:#16302a; --accent-ink:#0c1210; --track:#1f2b26;
  --seq-1:#1d3b31; --seq-2:#2f7a60; --seq-3:#4fc79a; --dim:#3d4c45;
  --away:#3987e5; --home:#d95926;
  --good:#4fd197; --good-soft:#12301f; --warn:#e2b44a; --warn-soft:#33290f; --serious:#f09a62; --serious-soft:#38210f; --crit:#ff806d; --crit-soft:#35191a;
  --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.wrap{padding-inline:24px}}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.k{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h3{font-size:13px;font-weight:700;margin:0;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
select,input[type=search],input[type=number]{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;min-width:0}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}

/* header and tabs */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,9.5vw,46px);line-height:.9;text-transform:uppercase;letter-spacing:.01em;margin:0}
.brand h1 span{color:var(--accent)}
.brand p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.fresh{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;border:0;background:none;padding:6px 14px 5px;cursor:pointer;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap}
@media (max-width:480px){.tabs{gap:0}.tabs button{font-size:15px;padding:6px 7px 5px;letter-spacing:.01em}.tabs .wk{display:none}}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabs .wk{margin-left:auto;align-self:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;padding-left:10px}
section.tab{display:flex;flex-direction:column;gap:14px}

/* the mix */
details.mix summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;list-style:none}
details.mix summary::-webkit-details-marker{display:none}
details.mix summary::before{content:"+";font-family:var(--f-mono);font-weight:600;color:var(--accent)}
details.mix[open] summary::before{content:"−"}
details.mix summary b{font-size:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 22px;margin-top:14px}
.w label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.w input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 2px}
.w small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag i{font-style:normal}
.t-held{background:var(--good-soft);color:var(--good)}
.t-weak{background:var(--warn-soft);color:var(--warn)}
.t-none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* the board */
.board td.pick b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.board tr{cursor:pointer}
.board td .sub{display:block;color:var(--muted);font-size:12px}
.board .sm{display:none}
@media (max-width:640px){.board .xs{display:none}.board .sm{display:inline}.board th,.board td{padding:7px 5px}}
.board tbody tr:hover td{background:var(--surface-2)}
.res td.pick b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.res td:first-child{white-space:nowrap}
.res .fin-s{display:none}
@media (max-width:640px){.res .xs{display:none}.res .fin-s{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}.res th,.res td{padding:7px 5px}}
.narrow{max-width:620px}
.split{display:flex;height:8px;gap:2px;min-width:90px}
.split i{display:block;height:100%}
.split .a{background:var(--away);border-radius:4px 0 0 4px}
.split .h{background:var(--home);border-radius:0 4px 4px 0}

/* game cards */
.games{display:flex;flex-direction:column;gap:14px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;margin-bottom:10px}
.gh .when{font-size:12px;color:var(--muted);font-weight:600}
.gtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px 26px;align-items:start}
@media (max-width:820px){.gtop{grid-template-columns:minmax(0,1fr)}}
.teamline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.teamline:last-of-type{border-bottom:0}
.teamline .nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.teamline .nm b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.teamline .nm span{color:var(--muted);font-size:12px;white-space:nowrap}
.teamline .sc{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sw.a{background:var(--away)} .sw.h{background:var(--home)}
.pickbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.pickbox b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.pickbox .conf{font-weight:600;color:var(--ink-2)}
.why{margin-top:10px;color:var(--ink-2);max-width:62ch}
.tug{display:flex;flex-direction:column;gap:5px}
.trow{display:grid;grid-template-columns:128px minmax(0,1fr) 92px;gap:10px;align-items:center}
@media (max-width:480px){.trow{grid-template-columns:100px minmax(0,1fr) 82px;gap:8px}}
.trow .tl{font-size:12.5px;font-weight:600;min-width:0}
.trow .tv{font-size:12px;text-align:right;white-space:nowrap}
.tb{position:relative;height:16px}
.tb::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.55}
.tb i{position:absolute;top:3px;height:10px}
.tb i.h{background:var(--home);border-radius:0 4px 4px 0}
.tb i.a{background:var(--away);border-radius:4px 0 0 4px}
.trow.off .tl,.trow.off .tv{color:var(--muted);font-weight:500}
.trow.sum{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.trow.sum .tl,.trow.sum .tv{font-weight:700}
.tax{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink-2)}
.tax span{display:inline-flex;align-items:center;gap:6px}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:13px}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 26px;margin-top:12px}
@media (max-width:820px){.sections{grid-template-columns:minmax(0,1fr)}}
.sec{min-width:0;display:flex;flex-direction:column;gap:8px}
.sec.wide{grid-column:1/-1}
.sec h4{margin:6px 0 0;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec p{color:var(--ink-2);max-width:68ch}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.p-out{background:var(--crit-soft);color:var(--crit)} .p-dbt{background:var(--serious-soft);color:var(--serious)} .p-q{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--good-soft);color:var(--good)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.plist li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px}
.plist li .pv{margin-left:auto;font-size:12px}
.plist li.off{color:var(--muted)}
.l5{display:inline-flex;gap:3px}
.l5 i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.l5 i.W{background:var(--good-soft);color:var(--good);border-color:transparent}
.news li{margin-bottom:6px;max-width:80ch}
.news{margin:0;padding-left:18px;color:var(--ink-2)}
.nt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* players */
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.controls input[type=search]{flex:1 1 180px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.likely{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
@media (max-width:820px){.likely{grid-template-columns:minmax(0,1fr)}}
.likely ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.likely li{display:grid;grid-template-columns:minmax(0,1fr) 64px 38px;gap:8px;align-items:center;font-size:13px}
.likely li button{all:unset;cursor:pointer;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.likely li button:hover{color:var(--accent)}
.likely li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meter{height:8px;background:var(--seq-1);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--seq-3);border-radius:4px 0 0 4px}
.plh,.prow{display:grid;grid-template-columns:minmax(0,1fr) 124px 92px 196px 76px 58px 82px;gap:0 10px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.plh{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.plh>span,.prow>span{text-align:right;min-width:0}
.plh>span:first-child,.prow>span:first-child{text-align:left}
@media (max-width:820px){.plh,.prow{grid-template-columns:minmax(0,1fr) 108px 52px}.plh .xs,.prow .xs{display:none}}
.prow{cursor:pointer}
.prow:hover,.prow.open{background:var(--surface-2)}
.prow .nm{font-weight:700}
.prow .sub{color:var(--muted);font-size:12px;display:block}
.pc{padding:14px 12px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2);border-bottom:1px solid var(--line);min-width:0}
.pc>*{min-width:0}
.pcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px 26px;align-items:start}
@media (max-width:820px){.pcgrid{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--f-display);font-size:42px;font-weight:700;line-height:1}
.big small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.range{position:relative;height:22px;margin:6px 0 2px}
.range .r90,.range .r50{position:absolute;top:7px;height:8px;border-radius:4px}
.range .r90{background:var(--seq-1)} .range .r50{background:var(--seq-2)}
.range .dot{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--seq-3);border:2px solid var(--surface-2)}
.range .mark{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.rax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr) 40px;gap:6px 10px;align-items:center;font-size:13px}
.ms .lab{font-weight:600;white-space:nowrap}
.you{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.you input{width:92px;font-family:var(--f-mono);font-weight:600}
.you .ans{font-weight:700}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .bar{fill:var(--dim)} .chart .bar.hit{fill:var(--seq-3)}
.chart .bar:hover,.chart .bar:focus{opacity:.8;outline:none}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink);stroke-width:1.5}
.chart .reft{fill:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px 14px}
.kv div{min-width:0}
.kv b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:600}
.kv span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:var(--shadow);line-height:1.35}

/* teams */
.rbar{position:relative;height:10px;width:110px;display:inline-block;vertical-align:middle}
.rbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.55}
.rbar i{position:absolute;top:0;height:10px;background:var(--seq-3)}
.rbar i.p{border-radius:0 4px 4px 0} .rbar i.n{border-radius:4px 0 0 4px;background:var(--dim)}
.sort{cursor:pointer;user-select:none;white-space:nowrap}
.sort:hover{color:var(--ink)}
.sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sort[data-dir]{color:var(--ink)}
.sort[data-dir]::after{content:" ▾";color:var(--accent)}
.sort[data-dir=asc]::after{content:" ▴"}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.filters .fg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.filters .k{margin:0}
.filters input.numin{width:76px}
.filters .clr{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer;padding:4px 2px}
.rk{font-size:11px;color:var(--muted);margin-left:4px}
tr.tsel td{background:var(--accent-soft)}
.teams td,.teams th{padding:7px 6px}

/* method */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1}
.kpi span{font-size:12px;color:var(--muted);line-height:1.4}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prose{display:flex;flex-direction:column;gap:10px}
.prose p{max-width:70ch;color:var(--ink-2)}
.dumb{position:relative;height:12px;width:150px;display:inline-block;vertical-align:middle}
.dumb::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:var(--track)}
.dumb i{position:absolute;top:1px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--surface)}
.dumb i.s{background:var(--dim)} .dumb i.w{background:var(--seq-3)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
footer{color:var(--muted);font-size:12px;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.tb i,.meter i{transition:width .25s ease,left .25s ease}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Matchup <span>Edge</span></h1>
      <p>NFL picks and player projections built from stats alone: team strength, quarterbacks, who is out, home field and the news. No sportsbooks, no odds.</p>
    </div>
    <div class="fresh" id="fresh"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="games" aria-selected="true">Games</button>
    <button role="tab" data-tab="players" aria-selected="false">Players</button>
    <button role="tab" data-tab="teams" aria-selected="false">Teams</button>
    <button role="tab" data-tab="method" aria-selected="false">How it works</button>
    <span class="wk" id="wk"></span>
  </nav>

  <section class="tab" id="games"></section>
  <section class="tab" id="players" hidden></section>
  <section class="tab" id="teams" hidden></section>

/* ---------- how it works ---------- */
function recordCard(){
  const R=D.record||{},a=wl(REC),miss=missOf(REC);
  if(R.broken)return `<div class="card"><div class="gh"><h2>Our record</h2></div><p style="color:var(--ink-2)">The record can’t be shown right now. The saved picks are safe; this page will show them again once the file is readable.</p></div>`;
  const since=R.since?new Date(R.since).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/Chicago'}):null;
  const keys=[...new Set(REC.map(r=>r[0]+'|'+r[1]))].reverse();
  const byWeek=keys.map(k=>{const rows=REC.filter(r=>r[0]+'|'+r[1]===k),w=wl(rows),m=missOf(rows);
    return `<tr><td class="num">${rows[0][0]} week ${rows[0][1]}</td><td class="num">${w.f?wlText(w):'pending'}</td><td class="num">${w.n?Math.round(w.w/w.n*100)+'%':'–'}</td><td class="num">${m==null?'–':m.toFixed(1)}</td></tr>`}).join('');
  const next=D.games.length?`This week’s ${D.games.length} picks are saved before each kickoff.`:'';
  const waiting=REC.length-a.f;
  /* every saved pick whose game has kicked off: the list is on the page from kickoff, before there is anything to grade */
  const every=REC.length?`<details style="margin-top:10px"${a.f?'':' open'}><summary class="fine" style="cursor:pointer">${a.f?'Every pick, newest first':'Picks waiting for a final'}</summary>${resTable(REC.slice().reverse())}</details>`:'';
  return `<div class="card"><div class="gh"><h2>Our record</h2><span class="when">${since?'Picks on record since '+esc(since):'Starting now'}</span></div>
    <p class="fine" style="max-width:86ch">The numbers above are a test on past seasons. This is the live record: each pick as this page showed it at its last refresh before kickoff, graded when the game ends. A saved pick can’t be changed once its game starts.</p>
    ${a.f?`<div class="kv" style="margin:12px 0 4px"><div><b>${wlText(a)}</b><span>winners picked${a.n?` (${Math.round(a.w/a.n*100)}%)`:''}${a.t?'. The third number is ties':''}</span></div><div><b>${miss==null?'–':miss.toFixed(1)}</b><span>average miss on the final margin, in points</span></div><div><b>${a.f}</b><span>games graded. A season is about 270, so a few weeks is a small sample</span></div></div>
      <div class="scroll narrow"><table><thead><tr><th>Week</th><th>Record</th><th>Winners</th><th>Avg. miss</th></tr></thead><tbody>${byWeek}</tbody></table></div>`
      :`<p style="margin-top:10px;color:var(--ink-2)">No pick has been graded yet.${waiting?` ${waiting} ${waiting===1?'game has':'games have'} kicked off and ${waiting===1?'is':'are'} waiting for a final.`:''}${next?' '+next:''} The record starts with the first final.</p>`}
    ${every}${a.f&&next?`<p class="fine" style="margin-top:8px">${next}</p>`:''}</div>`;
}
function renderMethod(){
  const t=M.test,a=t.all,pt=M.players_test,R=D.record;
  const cal=t.calibration.map(c=>`<tr><td class="num">${Math.round(c.lo*100)}–${Math.round(c.hi*100)}%</td><td class="num">${c.n}</td><td class="num">${fx(c.said,1)}%</td><td class="num">${fx(c.won,1)}%</td><td><span class="dumb" aria-hidden="true"><i class="s" style="left:${((c.said-50)*2).toFixed(1)}%"></i><i class="w" style="left:${((Math.max(50,Math.min(100,c.won))-50)*2).toFixed(1)}%"></i></span></td></tr>`).join('');
  const fac=FACTORS.filter(f=>t.without[f.k]).map(f=>{const w=t.without[f.k];return `<tr><td>${esc(f.label)}</td><td class="num">${t.size[f.k].toFixed(1)}</td><td class="num">${fx(w.win_pct,1)}%</td><td class="num">${w.mae.toFixed(2)}</td></tr>`}).join('');
  const ext=FACTORS.filter(f=>t.extra[f.k]).map(f=>{const w=t.extra[f.k];return `<tr><td>${esc(f.label)}</td><td class="num">${sg(w.weight,2)}</td><td class="num">${w.win_pct}%</td><td class="num">${w.mae.toFixed(2)}</td></tr>`}).join('');
  const seasons=Object.keys(M.by_season).sort().map(y=>{const s=M.by_season[y];return `<tr><td class="num">${y}</td><td class="num">${s.wins}–${s.decided-s.wins}</td><td class="num">${fx(s.win_pct,1)}%</td><td class="num">${s.mae.toFixed(1)}</td></tr>`}).join('');
  const wk={};(R.test||[]).forEach(r=>{const w=wk[r[0]]||(wk[r[0]]={w:0,l:0});if(r[5]!==0)r[6]?w.w++:w.l++});
  const tw=Object.values(wk).reduce((s,w)=>s+w.w,0),tl=Object.values(wk).reduce((s,w)=>s+w.l,0);
  const weeks=Object.keys(wk).map(Number).sort((x,y)=>x-y).map(w=>`<tr><td class="num">Week ${w}</td><td class="num">${wk[w].w}–${wk[w].l}</td></tr>`).join('');
  const pcal=pt?pt.calib.map(c=>`<tr><td class="num">${fx(c[0],1)}%</td><td class="num">${fx(c[1],1)}%</td><td class="num">${c[2].toLocaleString()}</td><td><span class="dumb" aria-hidden="true"><i class="s" style="left:${c[0]}%"></i><i class="w" style="left:${c[1]}%"></i></span></td></tr>`).join(''):'';
  const pst=pt?['pass_yds','rush_yds','rec_yds','rec'].map(s=>{const v=pt.stats[s];return `<tr><td>${esc(SLAB[s])}</td><td class="num">${v.n.toLocaleString()}</td><td class="num">${fx(v.mae,2)}</td><td class="num">${fx(v.mae_avg,2)}</td></tr>`}).join(''):'';
  $('#method').innerHTML=`
  <div class="kpis"><div class="kpi"><span class="k">Winners picked</span><b>${fx(a.win_pct,1)}%</b><span>${a.wins.toLocaleString()} of ${a.decided.toLocaleString()} games, ${t.first}–${t.last} week ${t.last_week}, each season picked with weights from the seasons before</span></div>
    <div class="kpi"><span class="k">Always the home team</span><b>${fx(t.baselines.home,1)}%</b><span>the same games</span></div>
    <div class="kpi"><span class="k">The better record</span><b>${fx(t.baselines.record,1)}%</b><span>the same games</span></div>
    <div class="kpi"><span class="k">Average miss</span><b>${a.mae.toFixed(1)}</b><span>points on the final margin. Games are noisy: the sharpest forecasts anywhere miss by about 10</span></div></div>
  ${recordCard()}
  <div class="two">
    <div class="card prose"><h2>How a pick is made</h2>
      <p>Every game starts from how strong each team has been: points scored and allowed, adjusted for who they played, with recent games counting most. Then come the things that change a game: who is at quarterback, which regulars are out, home field, a bye. Each one is measured in points and they add up to a projected margin. The margin becomes a win chance.</p>
      <p>Nothing here comes from a sportsbook. There are no lines, prices or odds anywhere in the numbers.</p>
      <p>The weight on each factor is not a guess. It is what that factor has been worth in ${M.fit_games.toLocaleString()} games since ${M.fit_from}, and the test below only counts games the weights had never seen.</p>
      <p>That is also why some popular ideas start at zero. Recent form, home and away records, head-to-head history and long trips are all on every game card, but none of them improved the picks once team strength was counted, so they add nothing unless you turn them up under “What counts in a pick”.</p>
      ${t.alt?`<p>Play-by-play efficiency was tested as the measure of team strength too (expected points added per play, adjusted for opponents). In place of points it picked ${fx(t.alt.epa.win_pct,1)}% and missed by ${t.alt.epa.mae.toFixed(2)}; with both together, ${fx(t.alt.both.win_pct,1)}% and ${t.alt.both.mae.toFixed(2)}. No real difference from points alone (${fx(a.win_pct,1)}% and ${a.mae.toFixed(2)}), so the pick uses points, and the play-by-play stats are on every game and team as research.</p>`:''}
      <p>What the test cannot see: it knows who actually started and played in old games, and their recorded wind and temperature, while a live pick has to go on injury reports and forecasts. Questionable players are counted at how often they have sat since 2016 (${pc(M.q_out)}; ${pc(M.q_out_qb)} for a quarterback).</p></div>
    <div class="card"><h2>When we say 70%, is it 70%?</h2><p class="fine" style="margin:6px 0 10px">Tested picks grouped by the chance we gave them. Grey dot: what we said. Green dot: how often the pick won.</p>
      <div class="scroll"><table><thead><tr><th>Chance given</th><th>Games</th><th>Said</th><th>Won</th><th class="l">50% → 100%</th></tr></thead><tbody>${cal}</tbody></table></div></div>
  </div>
  <div class="two">
    <div class="card"><h2>What each factor is worth</h2><p class="fine" style="margin:6px 0 10px">Its average size in a game, and what the test scores without it (all of them together: ${a.win_pct}% and ${a.mae.toFixed(2)}).</p>
      <div class="scroll"><table><thead><tr><th>Factor</th><th>Avg. points</th><th>Winners without it</th><th>Miss without it</th></tr></thead><tbody>${fac}</tbody></table></div>
      <h3 style="margin:16px 0 4px">Tested and not counted</h3><p class="fine" style="margin-bottom:8px">The weight each would get if it were let in, and the test with it added. None moves the needle.</p>
      <div class="scroll"><table><thead><tr><th>Factor</th><th>Fitted weight</th><th>Winners with it</th><th>Miss with it</th></tr></thead><tbody>${ext}</tbody></table></div></div>
    <div class="card"><h2>Season by season</h2><p class="fine" style="margin:6px 0 10px">The tested picks. A season’s weights come only from earlier seasons.</p>
      <div class="scroll"><table><thead><tr><th>Season</th><th>Record</th><th>Winners</th><th>Avg. miss</th></tr></thead><tbody>${seasons}</tbody></table></div>
      ${weeks?`<h3 style="margin:16px 0 4px">${R.test_season} so far, as tested: ${tw}–${tl}</h3><div class="scroll"><table><tbody>${weeks}</tbody></table></div><p class="fine" style="margin-top:8px">These are the model’s test picks, not picks published in advance. Those are under Our record.</p>`:''}</div>
  </div>
  ${pt?`<div class="two"><div class="card prose"><h2>Player projections</h2>
      <p>A player’s number is his team’s projected plays, times his share of them, times his efficiency against this opponent. The team’s plays come from our own projected score for the game.</p>
      <p>The chances (50+ yards, a touchdown, over your number) come from how players at his position have actually finished around projections like his. They were checked on ${pt.test.replace('-','–')}, seasons the player projections were not fitted on: across every milestone, what we said and what happened are in the table. Like the game test, the check knew who actually played.</p>
      <p>One limit worth knowing. If you type in a sportsbook’s number, remember that number already reflects late news and sharp money. Where our projection sits far from it, the book is right more often than we are, so treat a big gap as a reason to look closer, not as a sure thing.</p>
      <div class="scroll"><table><thead><tr><th>Stat</th><th>Player-games</th><th>Our average miss</th><th>His recent average’s miss</th></tr></thead><tbody>${pst}</tbody></table></div></div>
    <div class="card"><h2>Milestone chances, tested</h2><p class="fine" style="margin:6px 0 10px">Every milestone for every player, grouped by the chance we gave it.</p>
      <div class="scroll"><table><thead><tr><th>Said</th><th>Happened</th><th>Cases</th><th class="l">0% → 100%</th></tr></thead><tbody>${pcal}</tbody></table></div></div></div>`:''}
  <div class="card prose"><h2>Where the numbers come from</h2>
    <p>Schedules, results, play-by-play, player stats, snap counts and rosters: nflverse. Tracking stats (separation, time to throw, yards over expected): NFL Next Gen Stats. Charting (pressures, drops, yards after contact): Pro Football Reference. Injuries: ESPN’s list${D.live.inj_ts?', read '+esc(new Date(D.live.inj_ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'}))+' CT':''}. Forecasts: the National Weather Service. News: researched twice a day, with sources on each game.</p>
    <p>EPA (expected points added) is how much a play changed the points a team could expect on that drive. Success rate is the share of plays that gained enough to keep a drive on schedule.</p></div>`;
}

  if(e.target.id==='pclear'){resetP();S.player=null;renderPlayers();return}
  const ps=e.target.closest('[data-ps]');if(ps){const k=ps.dataset.ps;S.psort=[k,S.psort[0]===k?-S.psort[1]:(k==='name'?1:-1)];renderPlayers();const t=document.querySelector(`[data-ps="${k}"]`);if(t&&e.detail===0)t.focus();return}
  const pcEl=e.target.closest('.pc[data-p]');
  const st=e.target.closest('[data-stat]');if(st&&pcEl){S.stat[pcEl.dataset.p]=st.dataset.stat;renderPlayers();return}
  const wn=e.target.closest('[data-win]');if(wn&&pcEl){S.win[pcEl.dataset.p]=+wn.dataset.win;renderPlayers();return}
  const side=e.target.closest('[data-side]');if(side){S.tside=side.dataset.side;renderTeams();return}
  const ts=e.target.closest('[data-ts]');if(ts){const k=ts.dataset.ts;S.tsort=[k,S.tsort[0]===k?-S.tsort[1]:(k==='to'||k==='press'?(S.tside==='o'?1:-1):-1)];renderTeams();return}
  const tm=e.target.closest('tr[data-team]');if(tm){S.team=S.team===tm.dataset.team?null:tm.dataset.team;renderTeams();const d=$('#teamdetail');if(d)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}
  const row=e.target.closest('.prow');if(row&&!e.target.closest('a,button,input')){openPlayer(row.dataset.p);return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.prow,.sort')){e.preventDefault();e.target.click()}});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-k]'))keepOpen()},true);
let wt=null;
document.addEventListener('input',e=>{
  const w=e.target.dataset&&e.target.dataset.w;
  if(w){S.W[w]=+e.target.value;const o=$('#wo-'+w);if(o)o.textContent=S.W[w]+'%';clearTimeout(wt);wt=setTimeout(()=>{store.set('w',S.W);keepOpen();S.open.add('mix');const id=document.activeElement&&document.activeElement.id;renderGames();if(id){const el=document.getElementById(id);if(el)el.focus()}},120);return}
  if(e.target.id==='pnum'){S.pnum=e.target.value;clearTimeout(wt);wt=setTimeout(()=>{if(pNum()!=null)S.psort=['td',-1];else if(S.psort[0]==='td')S.psort=['proj',-1];renderPlayers();const el=$('#pnum');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},350);return}
  if(e.target.id==='pq'){S.q=e.target.value;S.player=null;clearTimeout(wt);wt=setTimeout(()=>{renderPlayers();const el=$('#pq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},180);return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='pgame'){S.game=e.target.value;S.player=null;renderPlayers();return}
  if(e.target.id==='ptype'){S.ptype=e.target.value;S.pnum='';S.player=null;S.psort=[S.ptype==='anytd'?'td':'proj',-1];renderPlayers();const el=$('#ptype');if(el)el.focus();return}
  const n=e.target.dataset&&e.target.dataset.num;const pcEl=e.target.closest&&e.target.closest('.pc[data-p]');
  if(n&&pcEl){const v=parseFloat(e.target.value);if(isFinite(v)&&v>=0){S.num[pcEl.dataset.p+'|'+n]=v;const id=e.target.id;renderPlayers();const el=document.getElementById(id);if(el)el.focus()}}
});
/* one tooltip for every mark that carries data-tip (hover and keyboard focus) */
const tip=$('#tip');
function showTip(el,x,y){tip.textContent=el.dataset.tip;tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2))+'px';tip.style.top=Math.max(8,y-r.height-12)+'px'}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',()=>{tip.hidden=true});
document.addEventListener('scroll',()=>{tip.hidden=true},true);

$('#wk').textContent=D.week==null?`NFL ${D.season}`:`NFL ${D.season} · Week ${D.week}`;
const warnB=t=>`<span class="badge" style="background:var(--warn-soft);color:var(--warn);border-color:transparent">${t}</span>`;
const injAge=D.live.inj_ts?(new Date(D.built)-new Date(D.live.inj_ts))/36e5:null;   /* hours between the injury list and this build */
const injB=!D.live.inj_n?(D.games.length?warnB('No injury list in this build'):''):injAge!=null&&injAge>6?warnB('Injuries as of '+esc(new Date(D.live.inj_ts).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'}))+' CT'):`<span class="badge"><i></i>${D.live.inj_n} injury listings</span>`;
$('#fresh').innerHTML=(D.preview?warnB('Preview'):'')+`<span class="badge"><i></i>Built ${esc(D.asof)}</span>`+injB+(D.news_meta&&D.news_meta.at?`<span class="badge"><i></i>News ${esc(new Date(D.news_meta.at).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'}))} CT</span>`:'');
$('#foot').textContent='Projections are estimates from past results and can be wrong. NFL only for now; the NBA is next, before its season opens. Stats from nflverse, NFL Next Gen Stats and Pro Football Reference; injuries from ESPN; forecasts from the National Weather Service.';
const first=(location.hash||'').slice(1),want=['games','players','teams','method'].includes(first)?first:store.get('tab','games');
setTab(['games','players','teams','method'].includes(want)?want:'games');
window.MatchupEdge={calc,pOver,quant,pAtLeast,state:S,data:D};
})();
